<!DOCTYPE html><!-- E-04 jest pełnoekranowy i CIEMNY — nie używa App.astro z NavBar --><html lang="pl"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wybierz przepis — Jutro jem</title><meta name="description" content="Planuj posiłki, wybierając przepisy kartami."><meta name="base-url" content="/mokoszo-v2"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/mokoszo-v2/_astro/index.Q_1rTHGk.css"><script type="module" src="/mokoszo-v2/_astro/hoisted._kxWOmo8.js"></script></head> <body class="min-h-dvh">  <div id="cards-root" class="min-h-dvh bg-emalia-900"> <!-- Dane dla Island --> <script id="all-recipes" type="application/json">[{"slug":"jajka-sadzone-na-grzankach","title":"Jajka sadzone na grzankach z awokado","timeMinutes":15,"calories":420,"slots":["sniadanie","drugie-sniadanie"],"ingredients":[{"slug":"jajka","name":"Jajka","amount":2,"unit":"szt"},{"slug":"chleb-pszenny","name":"Chleb pszenny (kromki)","amount":2,"unit":"szt"},{"slug":"awokado","name":"Awokado","amount":1,"unit":"szt"},{"slug":"sok-cytrynowy","name":"Sok z cytryny","amount":1,"unit":"łyżka"},{"slug":"sol","name":"Sól","amount":1,"unit":"szczypta"},{"slug":"pieprz","name":"Pieprz czarny","amount":1,"unit":"szczypta"}],"description":"Klasyczne śniadanie w nowej wersji — chrupiące grzanki, kremowe awokado i idealnie sadzone jajka.","steps":["Opiecz kromki chleba w tosterze lub na patelni grillowej.","Awokado rozgnieć widelcem, dodaj sok z cytryny, sól i pieprz.","Na suchej patelni na małym ogniu smaż jajka przez 3–4 minuty, aż białko się zetnie.","Posmaruj grzanki awokado i połóż na nich jajka.","Dopraw pieprzem i podawaj od razu."]},{"slug":"makaron-z-papryka-i-feta","title":"Makaron z papryką i fetą","timeMinutes":25,"calories":610,"slots":["obiad","kolacja"],"ingredients":[{"slug":"makaron-penne","name":"Makaron penne","amount":250,"unit":"g"},{"slug":"papryka-czerwona","name":"Papryka czerwona","amount":2,"unit":"szt"},{"slug":"feta","name":"Ser feta","amount":100,"unit":"g"},{"slug":"czosnek","name":"Czosnek","amount":3,"unit":"ząbek"},{"slug":"oliwa","name":"Oliwa z oliwek","amount":3,"unit":"łyżka"},{"slug":"sol","name":"Sól","amount":1,"unit":"szczypta"},{"slug":"pieprz","name":"Pieprz czarny","amount":1,"unit":"szczypta"}],"description":"Szybki makaron z pieczonym smakiem papryki i kremową fetą — minimum składników, maksimum smaku.","steps":["Ugotuj makaron al dente zgodnie z instrukcją na opakowaniu. Zachowaj szklankę wody po gotowaniu.","Pokrój paprykę w paski. Smaż na oliwie z czosnkiem przez 8–10 minut na średnim ogniu.","Kiedy papryka zmięknie, wrzuć odsączoną fetę i rozgnieć ją widelcem.","Dodaj ugotowany makaron i kilka łyżek wody z gotowania — sos powinien być kremowy.","Dopraw solą i pieprzem, podawaj od razu."]},{"slug":"owsianka-z-jablkiem","title":"Owsianka z jabłkiem i cynamonem","timeMinutes":10,"calories":340,"slots":["sniadanie"],"ingredients":[{"slug":"platki-owsiane","name":"Płatki owsiane","amount":80,"unit":"g"},{"slug":"mleko","name":"Mleko","amount":200,"unit":"ml"},{"slug":"jablko","name":"Jabłko","amount":1,"unit":"szt"},{"slug":"cukier","name":"Cukier trzcinowy","amount":10,"unit":"g"},{"slug":"cynamon","name":"Cynamon","amount":1,"unit":"szczypta"}],"description":"Klasyczne śniadanie, które da energię na poranek — gotowe w 10 minut.","steps":["Zagotuj mleko w małym garnku.","Wsyp płatki owsiane i gotuj na małym ogniu przez 4–5 minut, mieszając.","Jabłko zetrzyj na tarce lub pokrój w kostkę.","Przełóż owsiankę do miski, dodaj jabłko i cynamon.","Posłódź cukrem trzcinowym według smaku."]},{"slug":"placki-ziemniaczane","title":"Placki ziemniaczane ze śmietaną","timeMinutes":30,"calories":450,"slots":["obiad","kolacja","sniadanie"],"ingredients":[{"slug":"ziemniaki","name":"Ziemniaki","amount":700,"unit":"g"},{"slug":"jajka","name":"Jajka","amount":2,"unit":"szt"},{"slug":"maka-pszenna","name":"Mąka pszenna","amount":40,"unit":"g"},{"slug":"cebula","name":"Cebula","amount":1,"unit":"szt"},{"slug":"smietana-18","name":"Śmietana 18%","amount":100,"unit":"ml"},{"slug":"olej","name":"Olej roślinny","amount":4,"unit":"łyżka"},{"slug":"sol","name":"Sól","amount":1,"unit":"szczypta"}],"description":"Babciny przepis, który sprawdza się zawsze. Chrupiące z zewnątrz, miękkie w środku.","steps":["Zetrzyj ziemniaki na tarce o grubych oczkach. Cebulę zetrzyj lub posiekaj drobno.","Odciśnij jak najwięcej wody z tartych ziemniaków przez ściereczkę.","Wymieszaj ziemniaki z cebulą, jajkami i mąką. Dopraw solą i pieprzem.","Na rozgrzanej patelni z olejem smaż porcje ciasta po 3–4 minuty z każdej strony.","Odsącz na papierowym ręczniku i podawaj ze śmietaną."]},{"slug":"ryz-z-warzywami-stir-fry","title":"Ryż stir-fry z warzywami i jajkiem","timeMinutes":20,"calories":480,"slots":["obiad","kolacja"],"ingredients":[{"slug":"ryz-jasminowy","name":"Ryż jaśminowy","amount":200,"unit":"g"},{"slug":"jajka","name":"Jajka","amount":2,"unit":"szt"},{"slug":"marchew","name":"Marchew","amount":1,"unit":"szt"},{"slug":"groszek-mrozony","name":"Groszek mrożony","amount":100,"unit":"g"},{"slug":"sos-sojowy","name":"Sos sojowy","amount":2,"unit":"łyżka"},{"slug":"czosnek","name":"Czosnek","amount":2,"unit":"ząbek"},{"slug":"olej-sezamowy","name":"Olej sezamowy","amount":1,"unit":"łyżka"},{"slug":"olej","name":"Olej roślinny","amount":2,"unit":"łyżka"}],"description":"Klasyka azjatyckiej kuchni ulicznej — gotowa w 20 minut, najlepsza z ryżu z poprzedniego dnia.","steps":["Ugotuj ryż i ostudź (lub użyj wcześniej ugotowanego).","Na mocno rozgrzanej patelni lub woku podsmaż marchew pokrojoną w zapałki przez 3 minuty.","Dodaj czosnek, groszek i smaż minutę.","Zepchnij warzywa na bok, wbij jajka i szybko mieszaj tworząc jajecznicę.","Dodaj ryż, sos sojowy i olej sezamowy. Smaż mieszając przez 2–3 minuty.","Podawaj od razu."]},{"slug":"salatka-z-kurczakiem","title":"Sałatka z kurczakiem i rukolą","timeMinutes":20,"calories":380,"slots":["obiad","kolacja"],"ingredients":[{"slug":"piers-kurczaka","name":"Pierś kurczaka","amount":300,"unit":"g"},{"slug":"rukola","name":"Rukola","amount":80,"unit":"g"},{"slug":"pomidorki-koktajlowe","name":"Pomidorki koktajlowe","amount":150,"unit":"g"},{"slug":"parmezan","name":"Parmezan","amount":30,"unit":"g"},{"slug":"oliwa","name":"Oliwa z oliwek","amount":2,"unit":"łyżka"},{"slug":"sok-cytrynowy","name":"Sok z cytryny","amount":1,"unit":"łyżka"},{"slug":"sol","name":"Sól","amount":1,"unit":"szczypta"},{"slug":"pieprz","name":"Pieprz czarny","amount":1,"unit":"szczypta"}],"description":"Lekki obiad gotowy w 20 minut. Kurczak pieczony zamiast smażonego — mniej tłuszczu, więcej smaku.","steps":["Pierś kurczaka skrop oliwą, dopraw solą i pieprzem.","Piecz w 200°C przez 18–20 minut lub smaż na patelni grillowej.","Odczekaj 5 minut, pokrój w plastry.","Na talerzu ułóż rukolę, pomidorki przekrojone na pół i kurczaka.","Skrop sokiem z cytryny i oliwą, posyp startym parmezanem."]},{"slug":"sernik-na-zimno","title":"Sernik na zimno z malinami","timeMinutes":20,"calories":340,"slots":["deser"],"ingredients":[{"slug":"twarog","name":"Twaróg półtłusty","amount":500,"unit":"g"},{"slug":"smietana-18","name":"Śmietana 18%","amount":200,"unit":"ml"},{"slug":"cukier","name":"Cukier","amount":60,"unit":"g"},{"slug":"zelka","name":"Żelatyna","amount":10,"unit":"g"},{"slug":"maliny","name":"Maliny (mrożone)","amount":200,"unit":"g"},{"slug":"herbatniki","name":"Herbatniki maślane","amount":150,"unit":"g"},{"slug":"maslo","name":"Masło","amount":60,"unit":"g"}],"description":"Lekki sernik bez pieczenia — gotowy po 3 godzinach w lodówce.","steps":["Herbatniki zetrzyj na okruchy, wymieszaj z roztopionym masłem. Wyłóż dno formy (20 cm), wstaw do lodówki.","Żelatynę namocz w 50 ml zimnej wody przez 5 minut, potem rozpuść w gorącej wodzie w kąpieli wodnej.","Twaróg utrzyj z cukrem i śmietaną na gładką masę.","Wlej przestudzoną żelatynę do masy serowej, ciągle mieszając.","Wylej na spód, wstaw do lodówki na minimum 3 godziny.","Przed podaniem udekoruj malinami."]},{"slug":"tosty-french-toast","title":"French toast z cynamonem","timeMinutes":15,"calories":390,"slots":["sniadanie","deser"],"ingredients":[{"slug":"chleb-tostowy","name":"Chleb tostowy","amount":4,"unit":"szt"},{"slug":"jajka","name":"Jajka","amount":2,"unit":"szt"},{"slug":"mleko","name":"Mleko","amount":80,"unit":"ml"},{"slug":"cukier","name":"Cukier","amount":15,"unit":"g"},{"slug":"cynamon","name":"Cynamon","amount":1,"unit":"łyżeczka"},{"slug":"maslo","name":"Masło","amount":20,"unit":"g"}],"description":"Śniadanie jak z kawiarni — gotowe w kwadrans, z tym co zawsze masz w domu.","steps":["Roztrzep jajka z mlekiem, cukrem i cynamonem w miseczce.","Mocz kromki chleba w mieszance po 20 sekund z każdej strony.","Smaż na maśle 2–3 minuty z każdej strony, na średnim ogniu.","Podawaj z dżemem, miodem lub owocami."]},{"slug":"zapiekanka-z-soczewica","title":"Zapiekanka z soczewicą i pieczarkami","image":"/mokoszo-v2/images/zapiekanka-z-soczewica.jpg","timeMinutes":45,"calories":520,"slots":["obiad","kolacja"],"ingredients":[{"slug":"soczewica-czerwona","name":"Soczewica czerwona","amount":200,"unit":"g"},{"slug":"pieczarki","name":"Pieczarki","amount":300,"unit":"g"},{"slug":"cebula","name":"Cebula","amount":1,"unit":"szt"},{"slug":"czosnek","name":"Czosnek","amount":2,"unit":"ząbek"},{"slug":"passata","name":"Passata pomidorowa","amount":400,"unit":"g"},{"slug":"papryka-czerwona","name":"Papryka czerwona","amount":1,"unit":"szt"},{"slug":"ser-zolty","name":"Ser żółty (tarty)","amount":80,"unit":"g"},{"slug":"oliwa","name":"Oliwa z oliwek","amount":2,"unit":"łyżka"},{"slug":"sol","name":"Sól","amount":1,"unit":"szczypta"},{"slug":"pieprz","name":"Pieprz czarny","amount":1,"unit":"szczypta"}],"description":"Sycąca zapiekanka, w której soczewica zastępuje mięso mielone — bogata w białko,","steps":["Ugotuj soczewicę w osolonej wodzie przez 15 minut, aż będzie miękka. Odcedź.","Podsmaż posiekaną cebulę na oliwie przez 5 minut na złoto. Dodaj czosnek i smaż minutę.","Dodaj pokrojoną w kostkę paprykę, smaż 3 minuty.","Wrzuć pieczarki, smaż aż odparuje woda (ok. 5 minut).","Dodaj passatę i soczewicę, dopraw solą i pieprzem, gotuj razem 5 minut.","Przełóż do naczynia żaroodpornego, posyp tartym serem.","Zapiekaj w 180°C przez 20 minut, aż ser się zrumieni."]},{"slug":"zupa-krem-z-dyni","title":"Krem z dyni z imbirem","timeMinutes":35,"calories":180,"slots":["obiad"],"ingredients":[{"slug":"dynia","name":"Dynia (np. hokkaido)","amount":800,"unit":"g"},{"slug":"cebula","name":"Cebula","amount":1,"unit":"szt"},{"slug":"czosnek","name":"Czosnek","amount":2,"unit":"ząbek"},{"slug":"imbir-swiezy","name":"Imbir świeży","amount":20,"unit":"g"},{"slug":"bulion-warzywny","name":"Bulion warzywny","amount":750,"unit":"ml"},{"slug":"mleczko-kokosowe","name":"Mleczko kokosowe","amount":200,"unit":"ml"},{"slug":"oliwa","name":"Oliwa z oliwek","amount":2,"unit":"łyżka"},{"slug":"sol","name":"Sól","amount":1,"unit":"szczypta"}],"description":"Rozgrzewający krem, który gotuje się sam — blender robi całą robotę.","steps":["Pokrój dynię na kawałki (hokkaido: ze skórką). Cebulę pokrój w kostkę.","Na oleju zeszklij cebulę, dodaj czosnek i starty imbir, smaż minutę.","Dodaj dynię, wlej bulion. Gotuj pod przykryciem 20 minut.","Zblenduj na gładki krem. Wlej mleczko kokosowe, dopraw solą.","Podawaj z pestkami dyni lub kleksem śmietany."]}]</script> <!-- Island --> <div id="cards-mount"></div> </div>   </body> </html>
